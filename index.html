<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Standalone Web App Meta Tags for iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AmeOS">
  <meta name="theme-color" content="#0f172a">

  <title>AmeOS Web Concept</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      background-image: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar Area */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      padding-top: max(12px, env(safe-area-inset-top));
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .os-tag {
      opacity: 0.6;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Content Area */
    .content {
      padding: 20px;
    }

    /* Glassmorphism Card Widget */
    .widget {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 28px 20px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .widget h2 {
      font-size: 48px;
      font-weight: 200;
      letter-spacing: -1px;
    }

    .widget p {
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* App Launcher Grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 16px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
    }

    .icon-box {
      width: 62px;
      height: 62px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }

    .icon-box:active {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Fullscreen Overlay Window */
    #app-window {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      padding-top: env(safe-area-inset-top);
    }

    #app-window.active {
      transform: translateY(0);
    }

    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .window-body {
      padding: 24px;
      flex: 1;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <div id="desktop">
    <!-- Top Status Bar -->
    <header class="status-bar">
      <span id="clock">00:00</span>
      <span class="os-tag">AmeOS Concept</span>
    </header>

    <!-- Main Widget area -->
    <main class="content">
      <div class="widget">
        <h2 id="large-time">00:00</h2>
        <p id="date-display">Loading date...</p>
      </div>

      <!-- App Grid -->
      <div class="app-grid">
        <div class="app-icon" onclick="openApp('Settings', 'Configure system layout and options.')">
          <div class="icon-box">⚙️</div>
          <span>Settings</span>
        </div>
        <div class="app-icon" onclick="openApp('Camera', 'Camera module simulator initialized.')">
          <div class="icon-box">📷</div>
          <span>Camera</span>
        </div>
        <div class="app-icon" onclick="openApp('Browser', 'AmeOS Web Engine operational.')">
          <div class="icon-box">🌐</div>
          <span>Browser</span>
        </div>
        <div class="app-icon" onclick="openApp('Files', 'Storage root /sys/user/local')">
          <div class="icon-box">📁</div>
          <span>Files</span>
        </div>
      </div>
    </main>

    <!-- Slide-Up Window -->
    <div id="app-window">
      <div class="window-header">
        <span id="app-title" style="font-weight: 600;">App</span>
        <button class="close-btn" onclick="closeApp()">✕</button>
      </div>
      <div class="window-body" id="app-body">
        App content goes here.
      </div>
    </div>
  </div>

  <script>
    // Live Clock & Date Update
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      document.getElementById('clock').innerText = timeStr;
      document.getElementById('large-time').innerText = timeStr;

      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', options);
    }

    setInterval(updateClock, 1000);
    updateClock();

    // App Navigation Logic
    function openApp(name, desc) {
      document.getElementById('app-title').innerText = name;
      document.getElementById('app-body').innerText = desc;
      document.getElementById('app-window').classList.add('active');
    }

    function closeApp() {
      document.getElementById('app-window').classList.remove('active');
    }
  </script>
</body>
</html>
